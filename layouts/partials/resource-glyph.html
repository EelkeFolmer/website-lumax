{{- /* Hand-drawn category motif for the resources page. Pass the type key:
       paper | report | dataset | software | brochure | sites. Strokes use
       currentColor so the linework flips with the day/night theme; a soft
       watercolour wash sits behind it (see .rp__glyph in site.css). */ -}}
{{- $k := . -}}
<span class="rp__glyph rp__glyph--{{ $k }}" aria-hidden="true">
<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{{- if eq $k "paper" }}
  {{- /* a bird's feather resting on a large sheet of paper */ -}}
  {{- /* sheet of paper (behind): big, tilted, dog-eared corner + ruled lines */ -}}
  <path d="M9 13 L33 10 L35 36 L27 44 L11 45 Z"/>
  <path d="M35 36 L28 37 L27 44"/>
  <path d="M14 32 L25 31" stroke-width="1.1" opacity="0.6"/>
  <path d="M14 37 L27 36" stroke-width="1.1" opacity="0.6"/>
  <path d="M15 42 L24 41" stroke-width="1.1" opacity="0.6"/>
  {{- /* feather (over): vane outline, central shaft, barbs both sides */ -}}
  <path d="M15 38 C 18 32, 22 25, 26 20 C 30 15, 33 12, 36 10"/>
  <path d="M36 10 C 30 12, 25 16, 22 22 C 20 26, 19 30, 19 33"/>
  <path d="M36 10 C 37 15, 36 21, 32 27 C 28 31, 24 33, 19 33"/>
  <path d="M29 15 L26 13"/><path d="M29 15 L32 18"/>
  <path d="M26 19 L23 18"/><path d="M26 19 L30 23"/>
  <path d="M23 24 L20 24"/><path d="M23 24 L27 29"/>
{{- else if eq $k "report" }}
  {{- /* a bound report / open booklet */ -}}
  <path d="M24 13 C 20 10, 13 10, 8 12 L8 35 C 13 33, 20 33, 24 36 C 28 33, 35 33, 40 35 L40 12 C 35 10, 28 10, 24 13 Z"/>
  <path d="M24 13 L24 36"/>
  <path d="M12 18 L19 17"/><path d="M12 23 L19 22"/>
  <path d="M29 17 L36 18"/><path d="M29 22 L36 23"/>
{{- else if eq $k "dataset" }}
  {{- /* a pressed-leaf specimen with its label tag */ -}}
  <path d="M26 9 C 15 15, 14 30, 23 39 C 34 34, 36 18, 26 9 Z"/>
  <path d="M24 11 C 25 22, 24 32, 23 38"/>
  <path d="M24 18 C 21 18, 19 19, 17 21"/><path d="M24 18 C 27 18, 29 19, 30 22"/>
  <path d="M24 25 C 21 25, 19 26, 17 28"/><path d="M24 25 C 27 25, 29 26, 30 29"/>
  <rect x="7" y="35" width="10" height="7" rx="1.5"/>
  <circle cx="10" cy="38.5" r="0.9" fill="currentColor" stroke="none"/>
{{- else if eq $k "software" }}
  {{- /* a fish mapped with detection keypoints */ -}}
  <path d="M9 24 C 15 17, 28 17, 34 22 C 36 20, 39 18, 42 17 C 41 20, 41 23, 42 26 C 39 25, 36 25, 34 26 C 28 31, 15 31, 9 24 Z"/>
  <circle cx="15" cy="23" r="1.1" fill="currentColor" stroke="none"/>
  <path d="M22 20 L29 22 L24 27 Z" stroke-width="0.9" opacity="0.5"/>
  <circle cx="22" cy="20" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="29" cy="22" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="24" cy="27" r="1.5" fill="currentColor" stroke="none"/>
{{- else if eq $k "brochure" }}
  {{- /* a folded field brochure / map with a location pin */ -}}
  <path d="M8 13 L18 10 L30 13 L40 10 L40 35 L30 38 L18 35 L8 38 Z"/>
  <path d="M18 10 L18 35"/><path d="M30 13 L30 38"/>
  <circle cx="24" cy="21" r="2.4" fill="currentColor" stroke="none"/>
  <path d="M24 23 C 23 26, 22 28, 22 31"/>
{{- else if eq $k "platform" }}
  {{- /* a data platform — a monitor on a stand showing a chart */ -}}
  <rect x="7" y="9" width="34" height="23" rx="2.5"/>
  <path d="M24 32 L24 37"/>
  <path d="M17 38 L31 38"/>
  <path d="M12 26 L18 20 L23 24 L33 15"/>
  <circle cx="33" cy="15" r="1.3" fill="currentColor" stroke="none"/>
{{- else if eq $k "sites" }}
  {{- /* a compass */ -}}
  <circle cx="24" cy="24" r="15"/>
  <path d="M24 11 L27 24 L24 37 L21 24 Z"/>
  <circle cx="24" cy="24" r="1.6" fill="currentColor" stroke="none"/>
  <path d="M24 6 L24 9"/><path d="M24 39 L24 42"/><path d="M6 24 L9 24"/><path d="M39 24 L42 24"/>
{{- end }}
</svg>
</span>
