{{- $home := "/" -}}
<nav class="nav" data-nav>
  <a class="nav__logo" href="{{ $home | relURL }}" aria-label="Lumax — home">{{ partial "logo.html" . }}</a>
  <div class="nav__links">
    {{- range site.Menus.main }}
    <a href="{{ if $.IsHome }}{{ .URL }}{{ else }}{{ printf "/%s" .URL | relURL }}{{ end }}"{{ if and (not $.IsHome) (eq .Identifier "projects") }} class="is-current"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </div>
  <button class="nav__toggle" type="button" data-nav-toggle aria-label="Menu" aria-expanded="false">
    <span></span><span></span>
  </button>
</nav>
