[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.134.3"

# Previews get noindex instead of a canonical link to lumax.ai
[context.deploy-preview]
  command = "hugo -e preview --minify"

[context.branch-deploy]
  command = "hugo -e preview --minify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/team"
  to = "/about"
  status = 301

[[redirects]]
  from = "/team/"
  to = "/about/"
  status = 301
